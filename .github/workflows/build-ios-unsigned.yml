name: BTS Manager iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mobile/**'
      - '.github/workflows/build-ios-unsigned.yml'

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Prepare iOS target
        run: |
          chmod +x scripts/prepare_ios.sh
          chmod +x scripts/build_unsigned_ipa.sh
          ./scripts/prepare_ios.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build iOS without Apple signing
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Verify and harden final iOS Info.plist
        run: |
          APP_PLIST="build/ios/iphoneos/Runner.app/Info.plist"
          test -f "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string BTS Manager cần quyền vị trí để xác định vị trí hiện tại và tính khoảng cách đến các trạm BTS gần nhất." "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription BTS Manager cần quyền vị trí để xác định vị trí hiện tại và tính khoảng cách đến các trạm BTS gần nhất." "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string BTS Manager cần quyền vị trí để hỗ trợ chức năng xác định các trạm BTS gần nhất." "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription BTS Manager cần quyền vị trí để hỗ trợ chức năng xác định các trạm BTS gần nhất." "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string BTS Manager cần quyền vị trí để hỗ trợ chức năng xác định các trạm BTS gần nhất." "$APP_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysUsageDescription BTS Manager cần quyền vị trí để hỗ trợ chức năng xác định các trạm BTS gần nhất." "$APP_PLIST"
          echo "--- FINAL APP INFO.PLIST LOCATION KEYS ---"
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysUsageDescription" "$APP_PLIST"

      - name: Package unsigned IPA
        run: |
          rm -rf build/ios/unsigned_ipa/Payload
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned_ipa/Payload/Runner.app
          cd build/ios/unsigned_ipa
          zip -qry BTS_Manager_Mobile_V85_60_50_UNSIGNED.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BTS_Manager_Mobile_V85_60_50_UNSIGNED_IPA
          path: Mobile/build/ios/unsigned_ipa/BTS_Manager_Mobile_V85_60_50_UNSIGNED.ipa
          if-no-files-found: error
